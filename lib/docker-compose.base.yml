---
services:
    sharelatex:
        restart: always
        image: pingwin02/sharelatex-arm:full-2025-08-20@sha256:ad5b61f52e8a4d6cfed69219c6997a477bf0a3e217bdffd676b757e9afdd6714
        container_name: sharelatex
        volumes:
            - "${OVERLEAF_DATA_PATH}:${OVERLEAF_IN_CONTAINER_DATA_PATH}"
        networks:
            - default
            - web-server-network
        environment:
          GIT_BRIDGE_ENABLED: "${GIT_BRIDGE_ENABLED}"
          GIT_BRIDGE_HOST: "git-bridge"
          GIT_BRIDGE_PORT: "8000"
          REDIS_HOST: "${REDIS_HOST}"
          REDIS_PORT: "${REDIS_PORT}"
          V1_HISTORY_URL: "http://sharelatex:3100/api"
        env_file:
            - ../config/variables.env
        stop_grace_period: 60s

networks:
    web-server-network:
        external: true
